<ul>
	<li>Polls PR review comments on a configurable interval.</li>
	<li>Replies to new <code>@pickup</code> mentions with explanations.</li>
	<li>Optionally generates, commits, and pushes a fix when asked.</li>
	<li>Tracks seen comment IDs so nothing is processed twice.</li>
	<li>Supports full PR URLs or <code>owner/repo/pull/N</code> shorthand.</li>
</ul>
